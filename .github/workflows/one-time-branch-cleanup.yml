name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  remove-old-branches:
    if: github.repository == 'Epikaigle/deezer-update-tracker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old non-main branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            'feat/apkmirror-variants-three-column-history' \
            'feat/aurora-play-metadata' \
            'feat/compact-source-rows-and-apkmirror-archive' \
            'feat/version-codes' \
            'fix/audit-ux-selfupdate-v011' \
            'fix/ci-validation' \
            'release/first-signed-apk';
          do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
          echo 'Branch cleanup completed'
